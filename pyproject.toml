[project]
name = "clustering"
version = "0.1.3"
description = "Clustering algorithms for use with PolyChordLite"
authors = [{name="Adam Neil Ormondroyd", email="Adam.Ormondroyd@gmail.com"}]
readme = "README.md"
dependencies = [
    "numpy",
    "scipy",
    "pyclustering@git+https://github.com/adamormondroyd/pyclustering",
    "scikit-learn",
    "jax",
]

[project.urls]
repository = "https://github.com/adamormondroyd/clustering"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["black", "pytest"]
